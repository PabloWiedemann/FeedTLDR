[project]
name = "feedtldr-api"
version = "0.1.0"
description = "FeedTLDR API + pipeline + newsletter worker (legacy backend wrapped in FastAPI)"
requires-python = ">=3.10,<3.13"
dependencies = [
    # --- legacy pipeline (pinned to the versions the Streamlit app shipped with) ---
    "firebase-admin==6.6.0",
    "openai==1.59.6",
    "google-generativeai==0.8.4",
    "apify-client==2.2.0",
    "stripe==11.4.1",
    "pandas==2.1.4",
    "pyarrow==14.0.0",
    "tiktoken==0.8.0",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "icecream==2.1.4",
    "pytz>=2024.1",
    "six>=1.17.0",
    # --- API layer ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "nh3>=0.2.18",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 88
# Legacy modules are frozen; lint only for real breakage there.
lint.select = ["E9", "F63", "F7", "F82", "F401"]

[tool.ruff.lint.per-file-ignores]
"backend/*" = ["F401"]
"config/*" = ["F401"]
